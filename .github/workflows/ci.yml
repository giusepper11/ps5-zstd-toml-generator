name: CI

on: [push, pull_request]

permissions:
  contents: read

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Rust
        run: rustup toolchain install 1.85.1 --profile minimal --component rustfmt --component clippy
      - run: cargo +1.85.1 fmt --all -- --check
      - run: cargo +1.85.1 clippy --locked --all-targets -- -D warnings
      - run: cargo +1.85.1 test --release --locked
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
      - run: node scripts/sample-zstd.mjs --self-test
